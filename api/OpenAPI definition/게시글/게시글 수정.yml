info:
  name: 게시글 수정
  type: http
  seq: 2
  tags:
    - SNS 게시글 API

http:
  method: PUT
  url: "{{baseUrl}}/posts/:id"
  headers:
    - name: X-Member-Id
      value: "1"
      description: 작성자 회원 ID
      disabled: true
  params:
    - name: id
      value: "1"
      type: path
      description: 수정할 게시글 ID
  body:
    type: json
    data: |-
      {
        "content": "수정 내용",
        "imageUrl": "http:..."
      }
  auth:
    type: basic
    username: user1@example.com
    password: "1234"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: 게시글 수정 성공
    request:
      url: "{{baseUrl}}/api/v1/posts/:id"
      method: PUT
      headers:
        - name: X-Member-Id
          value: "1"
          description: 작성자 회원 ID
      params:
        - name: id
          value: "1"
          type: path
          description: 수정할 게시글 ID
      body:
        type: json
        data: |-
          {
            "content": "",
            "imageUrl": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": 1,
            "memberId": 10,
            "content": "스프링 부트 REST API 학습중입니다.",
            "imageUrl": "https://example.com/images/post1.png",
            "likeCount": 0,
            "createdAt": "",
            "updatedAt": ""
          }
  - name: 400 Response
    description: 입력값 유효성 검증 실패
    request:
      url: "{{baseUrl}}/api/v1/posts/:id"
      method: PUT
      headers:
        - name: X-Member-Id
          value: "1"
          description: 작성자 회원 ID
      params:
        - name: id
