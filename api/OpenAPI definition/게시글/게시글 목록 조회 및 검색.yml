info:
  name: 게시글 목록 조회 및 검색
  type: http
  seq: 4
  tags:
    - SNS 게시글 API

http:
  method: GET
  url: "{{baseUrl}}/posts?keyword=개발&memberId=1"
  params:
    - name: keyword
      value: 개발
      type: query
    - name: memberId
      value: "1"
      type: query
    - name: targetMemberIds
      value: "[]"
      type: query
      disabled: true
    - name: sortOrder
      value: ""
      type: query
      disabled: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: 목록 조회 성공
    request:
      url: "{{baseUrl}}/api/v1/posts"
      method: GET
      params:
        - name: keyword
          value: ""
          type: query
          disabled: true
        - name: memberId
          value: ""
          type: query
          disabled: true
        - name: targetMemberIds
          value: "[]"
          type: query
          disabled: true
        - name: sortOrder
          value: ""
          type: query
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "id": 1,
              "memberId": 10,
              "content": "스프링 부트 REST API 학습중입니다.",
              "imageUrl": "https://example.com/images/post1.png",
              "likeCount": 0,
              "createdAt": "",
              "updatedAt": ""
            }
          ]
  - name: 500 Response
    description: 내부 서버 오류
    request:
      url: "{{baseUrl}}/api/v1/posts"
      method: GET
      params:
        - name: keyword
          value: ""
          type: query
          disabled: true
        - name: memberId
          value: ""
          type: query
          disabled: true
        - name: targetMemberIds
          value: "[]"
          type: query
          disabled: true
        - name: sortOrder
          value: ""
          type: query
          disabled: true
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "",
            "message": "",
            "status": 0,
            "timestamp": "",
            "errors": [
              {
                "field": "",
                "rejectedValue": "",
                "reason": ""
              }
            ]
          }

docs: 검색 키워드 및 정렬 조건에 부합하는 게시글 목록을 반환합니다.
