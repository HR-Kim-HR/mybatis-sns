info:
  name: 로그인
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/auth/login"
  params:
    - name: id
      value: "2"
      type: query
      description: 수정할 게시글
      disabled: true
  body:
    type: json
    data: |-
      {
        "email": "user1@example.com",
        "password": "1234"
      }
  auth: inherit

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.accessToken
        method: jsonq
      variable:
        name: accessToken
        scope: runtime
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.refreshToken
        method: jsonq
      variable:
        name: refreshToken
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
